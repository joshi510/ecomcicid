name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecom_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecom_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecom_db?schema=public
      JWT_SECRET: ci-access-secret-key
      JWT_REFRESH_SECRET: ci-refresh-secret-key
      CLIENT_URL: http://localhost:5173
      STRIPE_SECRET_KEY: sk_test_replace_me
      STRIPE_PUBLISHABLE_KEY: pk_test_replace_me
      STRIPE_WEBHOOK_SECRET: whsec_replace_me
      VITE_API_URL: /api
      VITE_SITE_URL: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w server

      - name: Apply migrations
        run: npm run prisma:migrate:deploy -w server

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Production build
        run: npm run build:prod
        env:
          NODE_ENV: production

  docker:
    name: Build Docker images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${repo}-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repo}-web" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build storefront image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api' }}
            VITE_SITE_URL=${{ secrets.VITE_SITE_URL || 'https://localhost' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  netlify:
    name: Deploy storefront to Netlify
    needs: [verify, docker]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build storefront
        run: npm run build -w client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID are not set."
            echo "Netlify Git integration can still deploy this build from netlify.toml."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir client/dist --site "$NETLIFY_SITE_ID"
