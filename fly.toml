# fly launch --config fly.toml --no-deploy
# Then: fly postgres create && fly redis create && fly secrets set ...
# Deploy: fly deploy --config fly.toml --dockerfile server/Dockerfile

app = "ecom-api"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  COOKIE_SAMESITE = "none"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
