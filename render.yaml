# Optional Render Blueprint. You can also create services in the dashboard.
# https://render.com/docs/blueprint-spec

databases:
  - name: ecom-postgres
    plan: free
    postgresMajorVersion: "16"

services:
  - type: redis
    name: ecom-redis
    plan: free

  - type: web
    name: ecom-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecom-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ecom-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: LOG_LEVEL
        value: info
      - key: TAX_RATE
        value: "0.08"
      - key: SHIPPING_FLAT_RATE
        value: "9.99"
      - key: FREE_SHIPPING_THRESHOLD
        value: "75"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
